name: Feature request
description: Suggest an improvement or something Hermes Desktop has that the app lacks.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or use case, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
  - type: textarea
    id: desktop
    attributes:
      label: How does Hermes Desktop handle it?
      description: If Desktop or the TUI already does this, describe how.
