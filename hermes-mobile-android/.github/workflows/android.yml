name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android platform
        run: sdkmanager 'platforms;android-37.0'

      - name: Verify source contract
        run: python3 scripts/verify_source.py

      - name: Lint and build both variants
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hermes-mobile-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-mobile-validation
          path: |
            app/build/reports/
            app/build/test-results/
